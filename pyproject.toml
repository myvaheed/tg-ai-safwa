[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "safwa"
version = "0.1.0"
description = "Personal agile Telegram advisor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram>=3.22,<4",
  "aiosqlite>=0.20,<1",
  "arize-phoenix-otel>=0.16,<1",
  "cryptography>=46,<47",
  "fastembed>=0.7,<1",
  "greenlet>=3.0,<4",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "openai>=1.70,<3",
  "openinference-instrumentation-openai>=0.1,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "snowballstemmer>=3.0,<4",
  "SQLAlchemy>=2.0,<3",
  "sqlcipher3-wheels>=0.5.7,<1",
  "Telethon>=1.44,<2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
asr-local = [
  "faster-whisper>=1.1,<2",
]
# The same engine plus the CUDA runtime CTranslate2 loads by name. ~1.3 GB of wheels,
# which is what buys a GPU that works without touching PATH.
asr-cuda = [
  "faster-whisper>=1.1,<2",
  "nvidia-cublas-cu12>=12.4,<13",
  "nvidia-cudnn-cu12>=9.1,<10",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
safwa = "safwa.bootstrap.main:main"
safwa-qa-auth = "safwa.qa:auth_main"
safwa-backup = "safwa.security:backup_main"
safwa-restore = "safwa.security:restore_main"
safwa-key = "safwa.security:key_main"

[tool.hatch.build.targets.wheel]
packages = ["src/safwa", "src/llm_gateway", "src/agent_runtime", "src/telegram_llm", "src/tg_agent_shell"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
markers = [
  "e2e: isolated end-to-end tests using real SQLite and mocked remote boundaries",
  "live_telegram: opt-in live integration tests against the dedicated Safwa-QA bot",
  "live_provider: opt-in requests to the LLM provider SAFWA_AI_* configures",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["telegram-bot-exampler"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
