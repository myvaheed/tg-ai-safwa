[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "safwa"
version = "0.1.0"
description = "Personal agile Telegram advisor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram>=3.22,<4",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "matplotlib>=3.9,<4",
  "openai>=1.70,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0,<3",
  "Telethon>=1.44,<2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
safwa = "safwa.main:main"
safwa-auth = "safwa.history:auth_main"
safwa-qa-auth = "safwa.qa:auth_main"

[tool.hatch.build.targets.wheel]
packages = ["src/safwa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "e2e: isolated end-to-end tests using real SQLite and mocked remote boundaries",
  "live_telegram: opt-in live integration tests against the dedicated Safwa-QA bot",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["telegram-bot-exampler"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
